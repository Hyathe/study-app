<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>App Launcher</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#07070e;color:#f0efff;font-family:'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.wrap{max-width:400px;width:100%;text-align:center}
h1{font-size:22px;margin-bottom:6px;background:linear-gradient(90deg,#6c63ff,#ffd166);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
p{font-size:13px;color:#9b99cc;margin-bottom:28px}
.apps{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.app-card{background:#0f0f1a;border:1px solid #252540;border-radius:16px;padding:24px 16px;cursor:pointer;transition:all .2s;text-decoration:none;color:#f0efff;display:flex;flex-direction:column;align-items:center;gap:10px}
.app-card:hover{border-color:#32325a;transform:translateY(-2px)}
.app-icon{width:64px;height:64px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px}
.sb-icon{background:linear-gradient(135deg,#5549e0,#6c63ff)}
.de-icon{background:linear-gradient(135deg,#d4a000,#ffd166)}
.app-name{font-size:15px;font-weight:700}
.app-sub{font-size:11px;color:#9b99cc;text-align:center}
.note{font-size:11px;color:#4a4870;margin-top:20px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <h1>Your Study Apps</h1>
  <p>Open an app — then install it to your home screen</p>
  <div class="apps">
    <a href="studyboard/index.html" class="app-card">
      <div class="app-icon sb-icon">📚</div>
      <div class="app-name">StudyBoard</div>
      <div class="app-sub">A Level Tracker<br>Math · Eco · CS</div>
    </a>
    <a href="deutsch/index.html" class="app-card">
      <div class="app-icon de-icon">🇩🇪</div>
      <div class="app-name">Deutsch</div>
      <div class="app-sub">A1 → B1<br>Progress Tracker</div>
    </a>
  </div>
  <div class="note">
    On Android: tap ⋮ → "Add to Home Screen"<br>
    On iPhone: tap Share → "Add to Home Screen"<br>
    On PC (Chrome): click ⊕ in the address bar
  </div>
</div>
</body>
</html>
